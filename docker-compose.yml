services:
  postgres:
    image: postgres:16
    container_name: smartrestaurant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: table_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d table_management"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
